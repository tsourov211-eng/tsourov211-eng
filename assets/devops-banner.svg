<text x="67" y="265" fill="#38BDF8" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="2">TANVIR AHAMMED SOUROV</text>
<text x="1130" y="265" text-anchor="end" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="14">DEVOPS ENGINEERING</text>
