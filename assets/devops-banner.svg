<text x="64" y="151" fill="#F0F6FC" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700">BUILD. AUTOMATE. DEPLOY.</text>
<text x="67" y="191" fill="#B8C7D9" font-family="Arial,Helvetica,sans-serif" font-size="21">Modern applications, cloud infrastructure, and continuous delivery.</text>
